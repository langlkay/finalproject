<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my website</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>{{ message }}</h1>

    {% if artwork %}
        <div>
            <h2>{{ artwork.title }}</h2>
            <h2>{{ artwork.medium }}</h2>
            <img src="{{ url_for('static', filename='uploadedArt/' + artwork.photo) }}"
                alt = "uploaded art">

        </div>
    {% endif %}

    <h4>click <a href="/upload">here</a> to upload artworks</h4>

</body>
</html>
